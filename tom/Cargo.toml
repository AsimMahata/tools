[package]
name = "tom"
version = "0.1.0"
edition = "2021"
description = "Tool Manager - CLI tool to manage personal tools and repositories"
authors = ["Asim Mahata"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
dirs = "5.0"
