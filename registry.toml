# TOM Tool Registry
# Maps known tool names to their Git repositories, requirements, and step-by-step install/uninstall procedures

[tools.tom]
name = "tom"
description = "Tool Manager — CLI to manage personal tools and repositories"
repository = "https://github.com/AsimMahata/tom.git"
tags = ["tools", "cli", "git", "manager"]
requirements = [
    "Rust toolchain (cargo 1.75+)"
]
install_steps = [
    "cargo build --release"
]
tips = [
    "Clone into a dedicated parent folder like C:\\tools\\tom",
    "Install binary to ~/.cargo/bin/tom.exe for global terminal access"
]

[tools.netman]
name = "netman"
description = "Windows network management CLI"
repository = "https://github.com/AsimMahata/netman.git"
tags = ["network", "cli", "windows"]
requirements = [
    "Python 3.10+",
    "pip in PATH"
]
install_steps = [
    "pip install -e ."
]
uninstall_steps = [
    "pip uninstall -y netman"
]
tips = [
    "Run inside a virtual environment for isolation",
    "Run 'netman --help' to see network diagnostic and adapter management commands"
]

[tools.progit]
name = "progit"
description = "Git productivity enhancements and workflow helper"
repository = "https://github.com/AsimMahata/progit.git"
tags = ["git", "workflow", "productivity"]
requirements = [
    "Rust toolchain (cargo in PATH)"
]
install_steps = [
    "cargo build --release"
]
uninstall_steps = [
    "cargo clean"
]
tips = [
    "The compiled binary is placed in target/release/progit.exe",
    "Run 'progit --help' to view workflow commands"
]

[tools.logit]
name = "logit"
description = "Log inspection and management utility"
repository = "https://github.com/AsimMahata/logit.git"
tags = ["logging", "cli", "tools"]
requirements = [
    "Rust toolchain (cargo in PATH)"
]
install_steps = [
    "cargo build --release"
]
uninstall_steps = [
    "cargo clean"
]
tips = [
    "The compiled binary is placed in target/release/logit.exe",
    "Run 'logit --help' to see log filtering and formatting options"
]

[tools.sodo]
name = "sodo"
description = "YouTube → MP3 downloader CLI"
repository = "https://github.com/AsimMahata/sodo.git"
tags = ["youtube", "mp3", "downloader", "media", "cli"]
requirements = [
    "Python 3.10+",
    "pip in PATH"
]
install_steps = [
    "pip install -e ."
]
uninstall_steps = [
    "pip uninstall -y sodo"
]
tips = [
    "Run 'sodo --help' to see YouTube download and conversion commands",
    "Requires ffmpeg in PATH for audio extraction"
]
